<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEODNET High-Latitude Telemetry Dashboard</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #040711; color: #E2E8F0;
  font-family: "Segoe UI", "DejaVu Sans", Arial, sans-serif; }
#kpi { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 20px 10px 20px; }
.kpi-card { flex: 1 1 170px; background: #141A23; border: 1px solid #2D3748;
  border-radius: 10px; padding: 12px 16px; }
.kpi-label { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #94A3B8; }
.kpi-value { font-size: 30px; font-weight: 700; margin-top: 4px; }
.kpi-sub { font-size: 13px; color: #94A3B8; margin-top: 3px; }
#tabs { display: flex; gap: 6px; padding: 8px 20px 0 20px; border-bottom: 1px solid #2D3748; }
.tab-btn { background: transparent; color: #94A3B8; border: 1px solid transparent;
  border-bottom: 3px solid transparent; padding: 12px 22px; cursor: pointer; font-size: 16px; font-weight: 700; }
.tab-btn.active { color: #E2E8F0; border-bottom: 3px solid #66C2A5; }
main { padding: 16px 20px 28px 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; align-items: stretch; }
.chip { background: #0F1722; color: #94A3B8; border: 1px solid #2D3748;
  border-radius: 8px; padding: 9px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600;
  transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s; }
.chip:hover { border-color: #3B526E; color: #CBD5E1; }
.chip.active { color: #0B1220; background: #66C2A5; border-color: #66C2A5; font-weight: 700; }
.seg-toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; align-items: stretch; }
.seg-group { background: #161F2C; border: 1px solid #2D3748; border-radius: 12px;
  padding: 9px 12px 11px 12px; display: flex; flex-direction: column; gap: 8px; }
.seg-title { color: #64748B; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
.seg-row { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-row .chip { padding: 7px 12px; font-size: 13px; }
.seg-row .chip.active { box-shadow: 0 0 0 1px #66C2A5 inset, 0 0 12px rgba(102,194,165,0.5); }
.seg-layer .chip.active { background: #2AB7CA; border-color: #2AB7CA; color: #05161B;
  box-shadow: 0 0 0 1px #2AB7CA inset, 0 0 14px rgba(42,183,202,0.6); }
.canvas-wrap { position: relative; background: #141A23; border: 1px solid #2D3748; border-radius: 10px; padding: 8px; width: 100%; }
canvas { display: block; width: 100%; height: 64vh; min-height: 470px; cursor: crosshair; }
#canvas2 { height: calc(100vh - 190px); min-height: 560px; }
#canvasAurora { position: absolute; inset: 8px; width: auto; height: auto; pointer-events: none; cursor: default; }
.caption { color: #94A3B8; font-size: 14px; margin-top: 12px; line-height: 1.55; }
.hidden { display: none; }
#tooltip { position: fixed; pointer-events: none; background: #0B111A; border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 8px; padding: 12px 16px; color: #E2E8F0; z-index: 50; min-width: 210px;
  line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,0.55); }
#tooltip .tt-head { display: flex; align-items: center; gap: 10px; }
#tooltip .tt-uid { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
#tooltip .tt-pill { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 10px; color: #0B111A; }
#tooltip .tt-coord { font-size: 15px; color: #94A3B8; margin-top: 6px; font-variant-numeric: tabular-nums; }
#tooltip .tt-name { font-size: 15px; font-weight: 700; color: #66C2A5; }
</style>
</head>
<body>
<header id="kpi"></header>
<nav id="tabs">
  <button class="tab-btn active" data-tab="1">1 &#183; Network Dynamics</button>
  <button class="tab-btn" data-tab="2">2 &#183; Geodetic Map</button>
  <button class="tab-btn" data-tab="3">3 &#183; Regional Analytics</button>
</nav>
<main>
  <section id="panel1" class="tab-panel">
    <div class="controls" id="controls1"></div>
    <div class="canvas-wrap"><canvas id="canvas1"></canvas></div>
    <div class="caption" id="caption1"></div>
  </section>
  <section id="panel2" class="tab-panel hidden">
    <div class="seg-toolbar" id="controls2"></div>
    <div class="canvas-wrap" id="wrap2"><canvas id="canvas2"></canvas><canvas id="canvasAurora"></canvas></div>
    <div class="caption" id="caption2"></div>
  </section>
  <section id="panel3" class="tab-panel hidden">
    <div class="controls" id="controls3"></div>
    <div class="canvas-wrap"><canvas id="canvas3"></canvas></div>
    <div class="caption" id="caption3"></div>
  </section>
</main>
<div id="tooltip" class="hidden"></div>
<script>
const C = { bg: "#0D1117", panel: "#141A23", border: "#2D3748", grid: "#222B38",
  text: "#E2E8F0", muted: "#94A3B8", axis: "#CBD5E1", active: "#66C2A5",
  online: "#E5A93B", offline: "#D95F5F", gold: "#F2C14E", coast: "#3B526E" };
const LAYERS = [ { key: "active", label: "ACTIVE", color: C.active },
  { key: "online", label: "ONLINE", color: C.online },
  { key: "offline", label: "OFFLINE", color: C.offline } ];
const FONT_TITLE = "700 20px Segoe UI, DejaVu Sans, Arial";
const FONT_SUB = "14px Segoe UI, DejaVu Sans, Arial";
const FONT_AXIS = "700 13px Segoe UI, DejaVu Sans, Arial";
const FONT_LEGEND = "700 14px Segoe UI, DejaVu Sans, Arial";
const FONT_LABEL = "700 14px Segoe UI, DejaVu Sans, Arial";
let DATA = null;
const state = { tab: 1, chart: { 1: 0, 3: 0 }, region: "all",
  layers: { rings: false, vectors: true } };
const $ = (id) => document.getElementById(id);
function setupCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx: ctx, w: rect.width, h: rect.height };
}
function frame(ctx, w, h) { ctx.clearRect(0, 0, w, h); ctx.fillStyle = C.panel; ctx.fillRect(0, 0, w, h); }
function heading(ctx, text, sub) {
  ctx.textAlign = "left"; ctx.fillStyle = C.text; ctx.font = FONT_TITLE; ctx.fillText(text, 16, 30);
  if (sub) { ctx.fillStyle = C.muted; ctx.font = FONT_SUB; ctx.fillText(sub, 16, 52); }
}
function fmt(n) { return (n === null || n === undefined || isNaN(n)) ? "n/a" : Number(n).toLocaleString("en-US"); }
function pct(n, d) { return d > 0 ? (100 * n / d).toFixed(1) + "%" : "0.0%"; }
function dayStr(ms) { return ms ? new Date(ms).toISOString().slice(0, 10) : "n/a"; }
function statusColor(status) {
  if (status === "ACTIVE") return C.active;
  if (status === "ONLINE") return C.online;
  return C.offline;
}
function yAxisGuides(ctx, pad, iw, y0, hh, yMin, yMax, ticks, gridOn) {
  const span = (yMax - yMin) || 1;
  ctx.strokeStyle = C.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, y0); ctx.lineTo(pad.l, y0 + hh); ctx.lineTo(pad.l + iw, y0 + hh); ctx.stroke();
  for (let k = 0; k <= ticks; k++) {
    const value = yMin + span * k / ticks;
    const y = y0 + hh * (1 - (value - yMin) / span);
    if (gridOn) {
      ctx.strokeStyle = C.grid; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + iw, y); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.strokeStyle = C.border;
    ctx.beginPath(); ctx.moveTo(pad.l - 5, y); ctx.lineTo(pad.l, y); ctx.stroke();
    ctx.fillStyle = C.axis; ctx.font = FONT_AXIS; ctx.textAlign = "right";
    ctx.fillText(Math.round(value).toLocaleString("en-US"), pad.l - 9, y + 4);
  }
}

function xTicks(ctx, pad, iw, ih, labels, maxTicks) {
  const n = labels.length; if (n < 2) return;
  const step = Math.max(1, Math.ceil(n / maxTicks));
  ctx.fillStyle = C.axis; ctx.font = FONT_AXIS; ctx.textAlign = "center";
  for (let i = 0; i < n; i += step) {
    const x = pad.l + iw * i / (n - 1);
    ctx.strokeStyle = C.border; ctx.beginPath(); ctx.moveTo(x, pad.t + ih); ctx.lineTo(x, pad.t + ih + 5); ctx.stroke();
    ctx.fillText(labels[i], x, pad.t + ih + 22);
  }
}
function legend(ctx, w, items) {
  ctx.font = FONT_LEGEND; ctx.textAlign = "left";
  let x = w - 16;
  for (let i = items.length - 1; i >= 0; i--) {
    const tw = ctx.measureText(items[i].label).width;
    x -= tw; ctx.fillStyle = C.text; ctx.fillText(items[i].label, x, 28); x -= 9;
    ctx.fillStyle = items[i].color; ctx.fillRect(x - 13, 17, 13, 11); x -= 24;
  }
}
const T1 = { hover: -1, xAt: null, n: 0, series: null };
function drawTrack(ctx, pad, iw, y0, hh, series, key, color, title) {
  const vals = series.map((d) => d[key]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const buffer = Math.max(60, (hi - lo) * 0.3);
  const yMin = Math.max(0, lo - buffer), yMax = hi + buffer;
  const span = (yMax - yMin) || 1;
  const n = series.length;
  const xAt = (i) => pad.l + (n <= 1 ? 0 : iw * i / (n - 1));
  const yAt = (v) => y0 + hh * (1 - (v - yMin) / span);
  yAxisGuides(ctx, pad, iw, y0, hh, yMin, yMax, 3, true);
  ctx.fillStyle = color; ctx.font = FONT_LABEL; ctx.textAlign = "left";
  ctx.fillText(title, pad.l + 10, y0 + 20);
  ctx.beginPath(); ctx.moveTo(xAt(0), y0 + hh);
  for (let i = 0; i < n; i++) ctx.lineTo(xAt(i), yAt(series[i][key]));
  ctx.lineTo(xAt(n - 1), y0 + hh); ctx.closePath();
  ctx.fillStyle = color; ctx.globalAlpha = 0.16; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.beginPath();
  for (let i = 0; i < n; i++) { const y = yAt(series[i][key]); if (i === 0) ctx.moveTo(xAt(i), y); else ctx.lineTo(xAt(i), y); }
  ctx.stroke();
}
function renderMultiPanel(ctx, w, h) {
  const series = DATA.daily; const n = series.length;
  const pad = { l: 100, r: 28, t: 74 };
  const iw = w - pad.l - pad.r;
  const totalH = h - pad.t - 50;
  const gap = 16;
  const trackH = (totalH - gap * 2) / 3;
  heading(ctx, "Multi-Panel Daily Telemetry (Synchronized 3-Track View)", "shared time axis - hover for exact daily values");
  const y1 = pad.t, y2 = pad.t + trackH + gap, y3 = pad.t + 2 * (trackH + gap);
  drawTrack(ctx, pad, iw, y1, trackH, series, "active", C.active, "ACTIVE Stations (RTK-Ready)");
  drawTrack(ctx, pad, iw, y2, trackH, series, "online", C.online, "ONLINE Stations (QC-Gated)");
  drawTrack(ctx, pad, iw, y3, trackH, series, "offline", C.offline, "OFFLINE Stations");
  xTicks(ctx, pad, iw, totalH, series.map((d) => d.date.slice(5)), 9);
  ctx.fillStyle = C.muted; ctx.font = "13px Segoe UI, DejaVu Sans, Arial"; ctx.textAlign = "left";
  ctx.fillText("Archive " + series[0].date + " to " + series[n - 1].date + " (" + n + " days)", pad.l, y3 + trackH + 42);
  T1.xAt = (i) => pad.l + (n <= 1 ? 0 : iw * i / (n - 1));
  T1.n = n; T1.series = series;
  if (T1.hover >= 0 && T1.hover < n) {
    ctx.strokeStyle = C.text; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(T1.xAt(T1.hover), y1); ctx.lineTo(T1.xAt(T1.hover), y3 + trackH); ctx.stroke(); ctx.setLineDash([]);
  }
}
function renderDelta(ctx, w, h) {
  const series = DATA.daily; const n = series.length;
  const pad = { l: 100, r: 28, t: 76 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - 54;
  const deltas = [];
  for (let i = 1; i < n; i++) deltas.push({ date: series[i].date.slice(5), value: series[i].active - series[i - 1].active });
  const maxAbs = Math.max(1, ...deltas.map((d) => Math.abs(d.value)));
  heading(ctx, "Daily Net Change & Status Shifts (Delta Bar Chart)", "day-over-day ACTIVE delta: green up-ticks vs red down-ticks");
  const yMin = -maxAbs, yMax = maxAbs;
  const span = (yMax - yMin) || 1;
  yAxisGuides(ctx, pad, iw, pad.t, ih, yMin, yMax, 4, true);
  const zeroY = pad.t + ih * (1 - (0 - yMin) / span);
  const bw = iw / Math.max(1, deltas.length);
  deltas.forEach((d, i) => {
    const y = pad.t + ih * (1 - (d.value - yMin) / span);
    const top = Math.min(y, zeroY), height = Math.abs(zeroY - y);
    ctx.fillStyle = d.value >= 0 ? C.active : C.offline; ctx.globalAlpha = 0.85;
    ctx.fillRect(pad.l + i * bw + 1, top, Math.max(1, bw - 2), Math.max(1, height)); ctx.globalAlpha = 1;
  });
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(pad.l + iw, zeroY); ctx.stroke();
  xTicks(ctx, pad, iw, ih, deltas.map((d) => d.date), 9);
}
function renderCumulative(ctx, w, h) {
  const bars = DATA.cohort.bars; const n = bars.length;
  const pad = { l: 100, r: 28, t: 76 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - 54;
  const maxCum = Math.max(1, DATA.cohort.total);
  heading(ctx, "Cumulative Station Onboarding (by First-Seen Cohort)", "cumulative new joins across the observed epoch (total " + fmt(DATA.cohort.total) + ")");
  yAxisGuides(ctx, pad, iw, pad.t, ih, 0, maxCum, 4, true);
  const xAt = (i) => pad.l + (n <= 1 ? 0 : iw * i / (n - 1));
  ctx.beginPath(); ctx.moveTo(xAt(0), pad.t + ih);
  for (let i = 0; i < n; i++) ctx.lineTo(xAt(i), pad.t + ih * (1 - bars[i].cumulative / maxCum));
  ctx.lineTo(xAt(n - 1), pad.t + ih); ctx.closePath();
  ctx.fillStyle = C.active; ctx.globalAlpha = 0.16; ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = C.active; ctx.lineWidth = 2.2; ctx.beginPath();
  for (let i = 0; i < n; i++) { const y = pad.t + ih * (1 - bars[i].cumulative / maxCum); if (i === 0) ctx.moveTo(xAt(i), y); else ctx.lineTo(xAt(i), y); }
  ctx.stroke();
  xTicks(ctx, pad, iw, ih, bars.map((b) => b.date.slice(5)), 9);
}
function renderTab1() {
  const s = setupCanvas($("canvas1")); const ctx = s.ctx, w = s.w, h = s.h;
  frame(ctx, w, h);
  if (state.chart[1] === 1) { renderDelta(ctx, w, h); return; }
  if (state.chart[1] === 2) { renderCumulative(ctx, w, h); return; }
  renderMultiPanel(ctx, w, h);
}
const KX = Math.cos(66 * Math.PI / 180);
const MAP = { scale: 0, offX: 0, offY: 0, fit: false, proj: {}, hits: [],
  hover: null, pinned: null, dragging: false, lx: 0, ly: 0 };
const FOCUS = [
  { id: "mainland", label: "Nordic", lng0: 4.0, lng1: 31.5, lat0: 55.0, lat1: 71.8 },
  { id: "south", label: "Oslo South", lng0: 5.0, lng1: 13.0, lat0: 58.0, lat1: 62.0 },
  { id: "tromso", label: "Tromso North", lng0: 12.0, lng1: 31.0, lat0: 65.0, lat1: 72.0 },
  { id: "svalbard", label: "Svalbard", lng0: 8.0, lng1: 33.0, lat0: 74.0, lat1: 80.0 }
];
function project(lng, lat) { return [ lng * KX, lat ]; }
function toScreen(lng, lat) {
  const p = project(lng, lat);
  return [ MAP.offX + p[0] * MAP.scale, MAP.offY - p[1] * MAP.scale ];
}
function fitBounds(lng0, lng1, lat0, lat1, w, h) {
  const p0 = project(lng0, lat0), p1 = project(lng1, lat1);
  const minX = Math.min(p0[0], p1[0]), maxX = Math.max(p0[0], p1[0]);
  const minY = Math.min(p0[1], p1[1]), maxY = Math.max(p0[1], p1[1]);
  MAP.scale = Math.min((w * 0.9) / Math.max(1e-6, maxX - minX), (h * 0.9) / Math.max(1e-6, maxY - minY));
  MAP.offX = w / 2 - (minX + maxX) / 2 * MAP.scale;
  MAP.offY = h / 2 + (minY + maxY) / 2 * MAP.scale;
  MAP.fit = true;
  reproject();
}
function focusById(id, w, h) {
  const preset = FOCUS.find((f) => f.id === id) || FOCUS[0];
  fitBounds(preset.lng0, preset.lng1, preset.lat0, preset.lat1, w, h);
}
function reproject() {
  MAP.proj = {};
  for (const iso of Object.keys(DATA.boundaries)) {
    MAP.proj[iso] = DATA.boundaries[iso].map((ring) => ring.map((pt) => toScreen(pt[0], pt[1])));
  }
}
function ringPath(ctx, ring) {
  if (!ring.length) return;
  ctx.moveTo(ring[0][0], ring[0][1]);
  for (let i = 1; i < ring.length; i++) ctx.lineTo(ring[i][0], ring[i][1]);
  ctx.closePath();
}
function drawLand(ctx, w, h) {
  ctx.beginPath();
  for (const iso of Object.keys(MAP.proj)) {
    for (const ring of MAP.proj[iso]) ringPath(ctx, ring);
  }
  ctx.fillStyle = "#131C28"; ctx.fill();
  ctx.save();
  ctx.shadowColor = "#0284C7"; ctx.shadowBlur = 6;
  ctx.strokeStyle = "#38BDF8"; ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();
}

const AURORA_POLE_LAT = 80.5 * Math.PI / 180;
const AURORA_POLE_LON = -72.6 * Math.PI / 180;
const AURORA_KP = 2.5;
function auroraGeo(phiRad, theta) {
  const sinLat = Math.sin(AURORA_POLE_LAT) * Math.sin(phiRad) + Math.cos(AURORA_POLE_LAT) * Math.cos(phiRad) * Math.cos(theta);
  const latGeo = Math.asin(Math.max(-1.0, Math.min(1.0, sinLat))) * 180 / Math.PI;
  const y = Math.sin(theta) * Math.cos(phiRad);
  const x = Math.cos(AURORA_POLE_LAT) * Math.sin(phiRad) - Math.sin(AURORA_POLE_LAT) * Math.cos(phiRad) * Math.cos(theta);
  const lonGeo = (AURORA_POLE_LON + Math.atan2(y, x)) * 180 / Math.PI;
  return [lonGeo, latGeo];
}
const AURORA_BUF_SCALE = 0.25;
const AURORA_RAYS = 40;
const AURORA_REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const AURORA_HARMONICS = [ { amp: 0.9, k: 2.1, w: 0.05, ph: 0.0 },
  { amp: 0.5, k: 4.3, w: 0.083, ph: 1.7 }, { amp: 0.28, k: 7.7, w: 0.121, ph: 3.3 } ];
const AURORA_RAY_COLORS = [ "16, 185, 129", "34, 211, 238", "168, 85, 247" ];
const auroraBuf = document.createElement("canvas");
let auroraRAF = null;
let auroraStart = 0;
let auroraSeed = [];
function initAurora() {
  auroraSeed = [];
  for (let i = 0; i < AURORA_RAYS; i++) {
    auroraSeed.push({ f: i / AURORA_RAYS, w: 8 + 14 * Math.random(), h: 26 + 46 * Math.random(),
      ph: Math.random() * Math.PI * 2, sp: 0.4 + 0.9 * Math.random(), c: i % 3 });
  }
}
function auroraGuideScreens() {
  const samples = 48;
  const pole = [], eq = [];
  let prevLon = null, offset = 0;
  for (let i = 0; i <= samples; i++) {
    const theta = 2 * Math.PI * i / samples;
    const phiEq = (69.5 - 4.5 * Math.cos(theta) - 1.2 * AURORA_KP) * Math.PI / 180;
    const phiPole = (75.0 - 3.5 * Math.cos(theta) - 0.4 * AURORA_KP) * Math.PI / 180;
    const e = auroraGeo(phiEq, theta);
    const p = auroraGeo(phiPole, theta);
    if (prevLon !== null) { const d = e[0] - prevLon; if (d > 180) offset -= 360; else if (d < -180) offset += 360; }
    prevLon = e[0];
    pole.push(toScreen(p[0] + offset, p[1]));
    eq.push(toScreen(e[0] + offset, e[1]));
  }
  return { pole: pole, eq: eq, n: samples + 1 };
}
function auroraWave(s, t) {
  let v = 0;
  for (const h of AURORA_HARMONICS) v += h.amp * Math.sin(h.k * s * Math.PI + h.w * t + h.ph);
  return v;
}
function drawAuroraBuffer(w, h, t) {
  const sc = AURORA_BUF_SCALE;
  const bw = Math.max(1, Math.round(w * sc)), bh = Math.max(1, Math.round(h * sc));
  if (auroraBuf.width !== bw || auroraBuf.height !== bh) { auroraBuf.width = bw; auroraBuf.height = bh; }
  const bctx = auroraBuf.getContext("2d");
  bctx.setTransform(sc, 0, 0, sc, 0, 0);
  bctx.clearRect(0, 0, w, h);
  bctx.globalCompositeOperation = "lighter";
  const g = auroraGuideScreens();
  const n = g.n;
  const pixPerDeg = MAP.scale;
  const cx = new Array(n), cy = new Array(n), hu = new Array(n);
  let minX = 1e9, maxX = -1e9;
  for (let i = 0; i < n; i++) {
    const s = i / (n - 1);
    const e = g.eq[i], p = g.pole[i];
    const off = auroraWave(s, t) * pixPerDeg;

      "<br>ONLINE: " + fmt(row.online) + "<br>OFFLINE: " + fmt(row.offline) + "<br>Total monitored: " + fmt(row.total));
  });
  cv.addEventListener("mouseleave", () => { T1.hover = -1; hideTooltip(); if (state.tab === 1) renderTab1(); });
}
function init() {
  initAurora();
  buildKpi();
  buildChips();
  bindTabs();
  bindMapEvents();
  bindTab1Events();
  window.addEventListener("resize", () => { render(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopAurora();
    else if (state.tab === 2) startAurora();
  });
  render();
}
fetch("/api/telemetry").then((r) => r.json()).then((d) => { DATA = d; init(); }).catch((err) => {
  document.body.innerHTML = "<p style='padding:24px;color:#D95F5F'>Failed to load /api/telemetry: " + err + "</p>";
});
</script>
</body>
</html>
