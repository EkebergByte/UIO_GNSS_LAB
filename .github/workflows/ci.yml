name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Purity check
        run: python check_purity.py
      - name: Byte-compile
        run: python -m py_compile src/gnss_common.py src/nordic_station_classifier.py src/telemetry_ui.py check_purity.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v
